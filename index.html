<style>

:root{--stage:#e7eaef;--bezel:#14161a;--hint:rgba(60,130,255,.28);--hint-line:#3c82ff;--toast-bg:#1c1c1c;--toast-fg:#fff;color-scheme:light}

.fx{position:absolute;inset:0;pointer-events:none}
.fx>*{pointer-events:auto}
.fx>.hs{pointer-events:none}

.scr .bb,.scr .gl{pointer-events:none}

.enter{animation:enter .32s cubic-bezier(.2,.8,.2,1)}

@keyframes enterBack{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fadeout{animation:fadeOut .28s ease forwards}
.down{animation:down .32s cubic-bezier(.4,0,1,1) forwards}

.stick-pop{animation:stickPop .46s cubic-bezier(.3,.7,.4,1)}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes down{from{transform:none;opacity:1}to{transform:translateY(80px);opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.enter,.enter-back,.fade,.up{animation:none}.fadeout,.down{animation:none;opacity:0}}

const PINS=[
 ['Korea, Sokcho','Sokcho','11, Yeonggeumjeong-ro 2-gil, 24825','The sunset over the lake was breathtaking','It painted the sky in hues of orange and pink. Sat on the pavilion steps until the last light slid behind the lighthouse, then walked back along the breakwater with a warm can of corn tea.',0,0,[128.6003,38.2118],['c65d4c3169','b4b1b4edf7','aeb463fdd7'],128,14,5,['Get there 20 min before sunset','The pavilion steps are the best seat','Wind picks up fast — bring a layer']],
 ['Korea, Busan','Busan','219, Gwanganhaebyeon-ro, Suyeong-gu','Gwangan Bridge lit up the whole bay','Stayed on the sand until the drone show started. The bridge changes colour every few minutes and the waves look like they are glowing. Fried chicken from the alley behind the beach tastes better here.',3,2,[129.1186,35.1532],['f0e95ca852','77affa408d','9803fbb22f'],342,41,8,['Drone show on Saturdays at 8pm','Fried chicken in the alley behind','The bridge turns purple at 10']],
 ['Korea, Daegu','Daegu','6-11, Dalgubeol-daero 450-gil, Jung-gu','Murals and torn posters all afternoon','A lane where every wall is layered with murals and half-peeled gig posters. A busker played old folk songs at the corner, and the tiny record shop at the end lets you listen before you buy.',4,5,[128.6061,35.8604],['0c8819c4f1','ed6662f200','0a41ab6a61'],87,9,6,['Every wall is a new painting','Torn posters make the best backdrop','Busker on the corner at 4pm']],
 ['Korea, Gangneung','Gangneung','17, Changhae-ro 14beon-gil','Coffee with the sound of waves','Anmok coffee street is lined with roasteries facing the sea. I took my latte down to the blue benches and watched the tide roll in. Go early on weekdays for a window seat.',1,4,[128.9469,37.7726],['ce468e9545','a5a2d6e0cf','1b50b110ad'],203,22,4,['Take your latte down to the sand','Blue benches facing the water','Window seats go by 10am']],
 ['Korea, Jeonju','Jeonju','99, Girin-daero, Wansan-gu','Lanterns over the hanok rooftops','Walked the hanok village after dark when the lanterns came on. The rooftops curve like waves, every courtyard smells like grilled rice cakes, and the stone gate at the end glows amber.',6,6,[127.1530,35.8150],['1a2ccdd155','545a1c9ce2','d7ee0d3ada'],176,18,7,['Lanterns switch on at 7pm','Grilled skewers on every corner','The stone gate glows after dark']],
 ['Korea, Gyeongju','Gyeongju','9, Gyerim-ro, Hwangnam-dong','Green hills that are actually royal tombs','The burial mounds look like soft green waves in the middle of town. Cherry trees line the path in spring and the evening light turns everything gold. Bring a picnic blanket.',5,1,[129.2117,35.8384],['2660c9318e','b4c2f250c6','7b900c4b81'],154,12,9,['Royal tombs that look like hills','Cherry trees peak in early April','Bring a blanket for golden hour']],
 ['Korea, Seoul','Seoul','14, Yeonmujang-gil, Seongdong-gu','Old factories turned into cafés','Seongsu still has the brick walls of its shoe factories, now filled with galleries and wine bars. Found a tiny bakery selling salt bread that sells out by noon.',7,5,[127.0557,37.5446],['0b6838ebef','17b720ef5a','cc17e8e9c9'],231,27,3,['Salt bread sells out by noon','Natural wine bar opens at 6','Brick walls from the shoe factories']],
 ['Korea, Jeju','Jeju','284-12, Ilchul-ro, Seongsan-eup','Sunrise from the crater rim','A 25-minute climb in the dark, then the whole sky cracked open in orange. Below the crater, a sea cave opens onto a tiny beach you can only reach at low tide.',8,3,[126.9426,33.4581],['91aa61cb37','e920d4469d','70b348d199'],298,33,12,['Start the climb in the dark','A sea cave hides a tiny beach','Wind is wild at the top']],
 ['Korea, Sokcho','Sokcho','Jangsa-dong, Sokcho-si','A quiet harbor with a clear beach','Fishing boats come in around noon and the beach beside the port is almost empty. Spread out a mat, lie down and listen to the gulls. The squid sundae stall is a must.',2,4,[128.5703,38.2335],['d16aa1ec82','d0deb24a76','fd463b4ad8'],76,8,5,['Boats come in around noon','The squid sundae stall is a must','Read the paper to the sound of gulls']],
 ['Korea, Taean','Taean','Seunon-ri, Anmyeon-eup','Two rocks and a low-tide path','At low tide you can walk almost all the way to the Grandfather and Grandmother rocks. Rent a yellow umbrella by the dunes and wait — the sea turns completely pink at sunset.',4,2,[126.3325,36.4987],['609db0b807','b0d1b00c11','64f058d73d'],112,10,10,['Walk out when the tide is lowest','Yellow umbrellas for rent','The sea turns pink at sunset']],
 ['Korea, Daejeon','Daejeon','169, Dunsan-daero, Seo-gu','A forest walk in the middle of the city','Hanbat Arboretum is huge and the paths are shaded the whole way. The rose garden was in full bloom, the old iron bridge is hidden in the pines, and the lawn is made for naps.',3,7,[127.3895,36.3667],['a16b611bcb','dfd38b8050','363e59119f'],98,11,6,['Shade the whole way round','An iron bridge hidden in the pines','Nap spot on the big lawn']],

function setGrowLeft(t,str){t.dataset.fit=1;const d=Math.round(measure(t,str)-measure(t,txt(t)));setText(t,str);if(d<=0)return;
  let a=t;while(a&&a._abs&&a._abs[2]<200){a.style.width=(parseFloat(a.style.width)+d)+'px';const p=a.parentElement;

function fillDetail(root){

/* Icons Figma failed to export inside a few chips: walking-time chips without their feet icon, category badges cropped to 11px */
function fixChipIcons(root){
  const minChips=[...root.querySelectorAll('.t')].filter(t=>/^\d+ min$/.test(txt(t))).map(t=>t.parentElement);
  const ref=minChips.map(c=>c.querySelector(':scope > svg')).find(Boolean)||document.querySelector('.scr svg[data-feet]');
  for(const c of minChips){if(c.querySelector(':scope > svg')||!ref)continue;const v=ref.cloneNode(true);c.insertBefore(v,c.firstChild);}
  const syms=[...document.querySelectorAll('#sprite symbol')];
  root.querySelectorAll('svg').forEach(v=>{const u=v.querySelector('use');if(!u||!v._abs)return;const H=v._abs[3],W=v._abs[2];if(H>=20||W<28||W>40)return;
    const sib=v.previousElementSibling;if(!sib||!sib.querySelector||!sib.querySelector('.t'))return;
    const sym=document.getElementById(u.getAttribute('href').slice(1));const col=sym&&(sym.innerHTML.match(/fill="(#[0-9A-Fa-f]{6})"/)||[])[1];if(!col)return;
    const full=syms.find(s=>{const vb=(s.getAttribute('viewBox')||'').split(' ').map(Number);return vb[3]>=26&&vb[3]<=28&&vb[2]>=30&&vb[2]<=40&&s.innerHTML.includes(col);});
    if(!full)return;const vb=full.getAttribute('viewBox').split(' ').map(Number);
    u.setAttribute('href','#'+full.id);v.setAttribute('width',vb[2]);v.setAttribute('height',vb[3]);v.style.width=vb[2]+'px';v.style.height=vb[3]+'px';});
}
/* long replacement labels in fixed single-line boxes (song names) end with an ellipsis instead of being cut */
function ellipsize(root){root.querySelectorAll('.t[data-mock]:not([data-fit])').forEach(t=>{const cs=t.style;if(cs.whiteSpace!=='pre')return;const p=t.querySelector('p');if(!p)return;
  const w=parseFloat(cs.width)||0;if(w&&measure(t,txt(t))>w-3){p.style.cssText+='white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:'+w+'px';}});}
function fillMock(root,name){
  try{fillCards(root,name);if(name==='detail'||name==='arMemo')fillDetail(root);fixChipIcons(root);ellipsize(root);}catch(e){console.warn(e);}
}

    if(cfg.dim)try{map.addLayer({id:'dim',type:'background',paint:{'background-color':'#000000','background-opacity':cfg.dim}});}catch(e){}
    // the Figma route group carries a drop shadow meant for the drawn line; with a live map it would show as an empty box
    for(const o of overlays)if(!pins.includes(o)&&o.tagName!=='svg'){o.style.boxShadow='none';o.style.background='none';o.style.filter='none';}
    const pts=[];
    for(const p of pins){const a=p._abs;const cx=a[0]+a[2]/2-mx,cy=a[1]+a[3]/2-my;
      const ll=map.unproject([cx,cy]);const wrap=document.createElement('div');wrap.className=cfg.mks?'mk mks':'mk';
      wrap.style.cssText=`width:${a[2]}px;height:${a[3]}px`;p.style.left='0px';p.style.top='0px';p.style.transform='none';wrap.appendChild(p);
      new maplibregl.Marker({element:wrap,anchor:'center'}).setLngLat(ll).addTo(map);
      const n=parseInt((p.textContent||'').trim());if(!isNaN(n))pts.push([n,[ll.lng,ll.lat]]);}
    if(routes.length&&pts.length>=2){routes.forEach(r=>r.remove());pts.sort((a,b)=>a[0]-b[0]);
      map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:pts.map(p=>p[1])}}});
      map.addLayer({id:'route-shadow',type:'line',source:'route',paint:{'line-color':'rgba(0,0,0,.07)','line-width':16,'line-blur':15},layout:{'line-cap':'round','line-join':'round'}});
      map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#ffffff','line-width':4},layout:{'line-cap':'round','line-join':'round'}});}
  });
  map.on('error',()=>{});
}

/* Overlay transitions: screens in the same group (a component placed over the same base) don't slide as pages.
   Nodes that exist in both screens stay put, changed nodes cross-fade, sheets rise from / sink to the bottom. */
const OV_GROUPS=[['blind','search','filter','bm1','bm2','bm3'],['ar','arExplore','arMemo','arList','arAdd','arWrite','arRoute','arRouteList'],['fpins','fai']];
const SHEETS=['filter','arMemo','bm1'];
const sameGroup=(a,b)=>a&&b&&a!==b&&OV_GROUPS.some(g=>g.includes(a)&&g.includes(b));
function sigOf(el){const a=el._abs;if(!a)return null;
  let s=a.map(v=>Math.round(v)).join(',')+'|'+(el.getAttribute('style')||'').replace(/(^|;)\s*(left|top):[^;]*/g,'');
  if(el.classList&&el.classList.contains('t'))s+='|'+el.innerHTML;
  else if(el.tagName==='svg'){const u=el.querySelector('use');s+='|'+(u?u.getAttribute('href'):'');}
  return s;}
function sigSet(root){const S=new Set();root.querySelectorAll('div,svg').forEach(e=>{const s=sigOf(e);if(s)S.add(s);});return S;}
function diffMark(root,other,cls,sheetCls){
  const walk=el=>{for(const k of [...el.children]){
    if(k.classList.contains('hs')||k.classList.contains('rbg'))continue;
    if(k.classList.contains('pan')){if(cls==='fade')k.classList.add('fade');continue;}
    const s=sigOf(k);
    if(s===null){walk(k);continue;}
    if(other.has(s)){if(k.tagName!=='svg'&&!k.classList.contains('t'))walk(k);continue;}
    const a=k._abs;k.classList.add(sheetCls&&a[2]>=300&&a[1]>=280?sheetCls:cls);
  }};
  walk(root);
}
let stack=[], current=null, pinStack=[];
function show(name,anim='enter',push=true){
  if(!SCREENS[name])return;
  const el=render(name);anchor(el);if(/^(fpins|fai)$/.test(name)&&typeof stickyFolder==='function')stickyFolder(el);
  const prev=current&&current.dataset.screen;
  const ov=current&&sameGroup(prev,name);
  if(ov){
    const S=SCREENS[name];
    if((current._bg||'')!==(S.bg||'')){const r=document.createElement('div');r.className='rbg fade';r.style.cssText='inset:0;'+(S.bg||'background:#fff');el.insertBefore(r,el.firstChild);}
    el.style.background='transparent';
    device.insertBefore(el,document.getElementById('toast'));
    diffMark(el,sigSet(current),'fade',SHEETS.includes(name)?'up':null);
    diffMark(current,sigSet(el),'fadeout',SHEETS.includes(prev)?'down':null);
    current.style.pointerEvents='none';
  }else{
    if(anim)el.classList.add(anim);
    device.insertBefore(el,document.getElementById('toast'));
  }
  el._bg=SCREENS[name].bg||'';
  initMaps(el);
  if(current){const old=current;setTimeout(()=>{(old._maps||[]).forEach(m=>{try{m.remove()}catch(e){}});old.remove();if(ov&&current===el)el.style.cssText=SCREENS[name].bg||'background:#fff';},ov?380:anim?330:0);}
  current=el;
  if(push){stack.push(name);pinStack.push(PIN);}
  try{history.replaceState(null,'','#'+name)}catch(e){}
}
function back(){if(stack.length>1){stack.pop();pinStack.pop();PIN=pinStack[pinStack.length-1];PINPHOTO=null;PINSTACK=null;show(stack[stack.length-1],'enter-back',false);}}
function tab(name){stack=[];pinStack=[];show(name,'fade');}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600);}
function flashHint(){if(current&&(current.querySelector('.bmov')||(current._noHint&&Date.now()-current._noHint<2500)))return;device.classList.add('hint');setTimeout(()=>device.classList.remove('hint'),450);}

function run(act){
  for(const a of act.split('|')){
    const [k,v]=a.split(':');
    if(k==='go')show(v,'enter');
    else if(k==='sheet')show(v,'up');
    else if(k==='swap'){show(v,'fade',false);stack[stack.length-1]=v;pinStack[pinStack.length-1]=PIN;}
    else if(k==='tab')tab(v);
    else if(k==='back')back();
    else if(k==='noop'){}
    else if(k==='toast')toast(v);
    else if(k==='ov'){if(v==='askai')openAskAI();}
    else if(k==='later'){const next=a.split(':').slice(2).join(':');setTimeout(()=>run(next),+v);}
  }
}
// Device-local (430x932) coordinates, independent of how the browser reports rects under zoom/transform.
function devPt(e){const r=holder.getBoundingClientRect();return [(e.clientX-r.left)/SCALE,(e.clientY-r.top)/SCALE];}
function localRect(el){let x=0,y=0;const w=el.offsetWidth,h=el.offsetHeight;let n=el;
  while(n&&n!==device){x+=n.offsetLeft;y+=n.offsetTop;const op=n.offsetParent;let p=n.parentElement;
    while(p&&p!==op&&p!==device){x-=p.scrollLeft;y-=p.scrollTop;p=p.parentElement;}
    if(op&&op!==device){x-=op.scrollLeft;y-=op.scrollTop;}n=op;}
  return [x,y,w,h];}
// Hotspots don't block touches (so carousels and panels can scroll); a click is matched against their rectangles.
device.addEventListener('click',e=>{
  if(!current)return;
  if(e.target.closest&&e.target.closest('.aiov'))return;
  if(current._held){current._held=false;return;}
  if(tryToggle(e))return;
  const da=e.target.closest&&e.target.closest('[data-act]:not(.hs)');
  if(da){if(da.dataset.pin!=null){PIN=da.dataset.pin;PINPHOTO=null;PINSTACK=null;}run(da.dataset.act);return;}
  const [px,py]=devPt(e);
  const ph=document.elementsFromPoint(e.clientX,e.clientY).map(n=>n.closest&&n.closest('[data-pin]')).find(Boolean);
  const hs=[...current.querySelectorAll('.hs')].reverse();
  for(const h of hs){const [l,t,w,ht]=localRect(h);if(px>=l&&px<=l+w&&py>=t&&py<=t+ht){const act=h.dataset.act;if(/detail|arMemo/.test(act)){PIN=ph?ph.dataset.pin:(pinIdx(PIN)+3)%NP;PINPHOTO=null;PINSTACK=ph&&ph.dataset.stack?STACKS[pinIdx(PIN)]:null;}run(act);return;}}
  flashHint();
});
device.addEventListener('keydown',e=>{const h=e.target.closest('.hs');if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();run(h.dataset.act);}});
/* Exhibition helpers: return to the start screen after idle time, keep the screen awake */
const KIOSK=window.KIOSK||{idle:0};
let idleT;function poke(){clearTimeout(idleT);if(KIOSK.idle>0)idleT=setTimeout(()=>{stack=[];show(START,'fade');},KIOSK.idle*1000);}
['pointerdown','keydown','wheel'].forEach(ev=>addEventListener(ev,poke,{passive:true}));poke();
let wl=null;async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null);}}catch(e){}}
addEventListener('pointerdown',wake,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});
addEventListener('contextmenu',e=>e.preventDefault());
const first=(location.hash||'').slice(1);
show(SCREENS[first]?first:START,null);
</script>
